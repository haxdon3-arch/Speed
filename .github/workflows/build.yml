name: Build iOS Dylib
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install Theos dependencies
        run: |
          brew install ldid xz

      - name: Setup Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Force create plist and control
        run: |
          cat << 'EOF' > SpeedHack.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Filter</key>
            <dict>
              <key>Bundles</key>
              <array>
                <string>com.apple.UIKit</string>
              </array>
            </dict>
          </dict>
          </plist>
          EOF
          
          cat << 'EOF' > control
          Package: com.ollie.speedhack
          Name: SpeedHack
          Depends: mobilesubstrate
          Version: 1.0
          Architecture: iphoneos-arm64
          Description: Ad Accelerator
          Maintainer: ollie
          Author: ollie
          Section: Tweaks
          EOF

      - name: Build Dylib
        run: |
          export THEOS=~/theos
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedHack-Release
          path: |
            .theos/obj/**/*.dylib
            .theos/obj/*.dylib
